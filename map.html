<script>
(async function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "zdash-key-" + P.salt;
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  async function decrypt(key) {
    var pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
    var stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var k = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      show(await decrypt(k));
      return;
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
  var gate = document.getElementById("gate"), go = document.getElementById("go"),
      pw = document.getElementById("pw"), err = document.getElementById("err");
  gate.hidden = false; pw.focus();
  gate.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value),
                                               "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        {name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"},
        base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
      var html = await decrypt(key);
      try {
        var raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw)));
      } catch (_) {}
      show(html);
    } catch (e) {
      err.textContent = "Incorrect password";
      pw.value = ""; pw.focus();
      go.disabled = false; go.textContent = "Enter";
    }
  });
})();
</script></body></html>
