<style id="css">
  :root{
    --bg:#FBFCFB; --surface:#FFFFFF; --surface-2:#F4F7F5;
    --ink:#14201C; --ink-2:#3C4A45; --muted:#6B7B74; --line:#DDE5E1;
    --accent:#0F766E; --accent-soft:#E3F1EE;
    --ok:#15803D; --ok-soft:#E4F2E9;
    --warn:#A16207; --warn-soft:#F8EFDC;
    --crit:#B91C1C; --crit-soft:#FAE7E6;
    --radius:6px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622;
      --ink:#E6EDE9; --ink-2:#B4C2BC; --muted:#83978F;
      --line:#2A3733; --accent:#4FD1C5; --accent-soft:#123330;
      --ok:#4ADE80; --ok-soft:#12301F;
      --warn:#E3B341; --warn-soft:#32270D;
      --crit:#F87171; --crit-soft:#3A1614;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622;
    --ink:#E6EDE9; --ink-2:#B4C2BC; --muted:#83978F; --line:#2A3733;
    --accent:#4FD1C5; --accent-soft:#123330;
    --ok:#4ADE80; --ok-soft:#12301F;
    --warn:#E3B341; --warn-soft:#32270D;
    --crit:#F87171; --crit-soft:#3A1614;
  }
  :root[data-theme="light"]{
    --bg:#FBFCFB; --surface:#FFFFFF; --surface-2:#F4F7F5;
    --ink:#14201C; --ink-2:#3C4A45; --muted:#6B7B74; --line:#DDE5E1;
    --accent:#0F766E; --accent-soft:#E3F1EE;
    --ok:#15803D; --ok-soft:#E4F2E9;
    --warn:#A16207; --warn-soft:#F8EFDC;
    --crit:#B91C1C; --crit-soft:#FAE7E6;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px;
        display:flex;flex-direction:column;gap:22px}

  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .stamp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}

  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
         gap:1px;background:var(--line);border:1px solid var(--line);
         border-radius:var(--radius);overflow:hidden}
  .stat{background:var(--surface);padding:11px 13px;display:flex;
        flex-direction:column;gap:2px}
  .stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
           color:var(--muted)}
  .stat .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;
           font-weight:600;letter-spacing:-.02em}
  .stat .n{font-size:11px;color:var(--muted)}

  .banner{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;
          border-radius:var(--radius);border:1px solid;font-size:13.5px}
  .banner.crit{background:var(--crit-soft);border-color:var(--crit);color:var(--ink)}
  .banner.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
  .banner b{font-weight:650}
  .banner .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .banner.crit .dot{background:var(--crit)}
  .banner.ok .dot{background:var(--ok)}

  section.panel{background:var(--surface);border:1px solid var(--line);
                border-radius:var(--radius);overflow:hidden}
  .phead{padding:14px 16px 12px;border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
  .phead h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
  .phead .why{color:var(--muted);font-size:12.5px;flex-basis:100%}
  .count{margin-left:auto;font-family:var(--mono);font-size:12px;
         color:var(--muted);font-variant-numeric:tabular-nums}
  .asof{font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--muted);
        display:inline-flex;align-items:center;gap:4px}
  .asof .dot{width:6px;height:6px;border-radius:50%;flex:none}

  .scroll{overflow-x:auto}
  .dirq{width:100%;max-width:340px;margin:0 0 10px;padding:7px 10px;
        border:1px solid var(--line);border-radius:5px;background:var(--surface);
        color:var(--ink);font:inherit;font-size:13px}
  .dirq:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .hdl{display:inline-flex;gap:5px;flex-wrap:wrap}
  .hdl a{font-size:11px;text-decoration:none;border:1px solid var(--line);
         border-radius:4px;padding:1px 5px;color:var(--ink-2)}
  .hdl a:hover{border-color:var(--accent);color:var(--accent)}
  .blurb{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
     color:var(--muted);font-weight:600;padding:9px 12px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;
         text-align:right;white-space:nowrap}
  .co{font-weight:600}
  .why-line{font-family:var(--mono);font-size:12px;color:var(--ink-2);

  tr.below td{background:var(--surface-2);color:var(--muted)}
  tr.below .co{font-weight:500;text-decoration:line-through;
               text-decoration-color:var(--muted);text-decoration-thickness:1px}
  tr.below td.num{text-decoration:line-through;opacity:.65}
  .divider td{background:var(--surface-2);padding:9px 12px;font-size:11.5px;

              border-bottom:1px solid var(--line)}
  .divider b{color:var(--ink);font-weight:650}
  tr.stripe-crit{box-shadow:inset 3px 0 0 var(--crit)}
  tr.stripe-warn{box-shadow:inset 3px 0 0 var(--warn)}
  tr.stripe-ok{box-shadow:inset 3px 0 0 var(--ok)}

  .chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
        font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
  .chip.new{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .chip.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .chip.mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}

  /* Sector reads as a column, not a badge. It is a stable attribute of the
     company rather than a status, so it gets the same quiet treatment as the
     other reference columns -- chips are reserved for things that change
     (CRM state, "this month", "does not qualify"). */
  td.sector{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
  tr.passed td.sector,tr.below td.sector{color:var(--muted)}

  .bars{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
  .bar{display:grid;grid-template-columns:104px 1fr 44px;gap:10px;align-items:center}
  .bar .lab{font-size:12.5px;color:var(--ink-2)}
  .bar .track{display:block;height:9px;background:var(--surface-2);
              border-radius:99px;overflow:hidden}
  /* display:block is required -- .track is a grid item and blockifies, but
     .fill is a plain span inside it, so height:100% on an inline box is
     ignored and only the grey track paints. */
  .bar .fill{display:block;height:100%;border-radius:99px;
             background:var(--accent)}
  .bar .fill.s1{background:#94A3A0} .bar .fill.s2{background:#5E9C86}
  .bar .fill.s3{background:#2F8A6B} .bar .fill.s4{background:#12795C}
  .bar .fill.s5{background:#0B6B52} .bar .fill.s6{background:#0F766E}
  .bar .n{font-family:var(--mono);font-size:12px;text-align:right;
          font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .split > div{background:var(--surface)}
  .split h3{margin:0;padding:12px 16px 2px;font-size:11px;letter-spacing:.06em;
            text-transform:uppercase;color:var(--muted);font-weight:600}
  @media (max-width:720px){ .split{grid-template-columns:1fr} }

  /* B2C panels are hand-authored SVG, not a chart library, so scaling has to
     be handled the same way img scaling would be: viewBox does the math,
     width:100%/height:auto does the fit, and the wrap padding keeps axis
     text off the panel border. */
  svg.chart{display:block;width:100%;height:auto;max-width:100%}
  .chart-wrap{padding:2px 16px 16px}
  .chart-note{margin:0;padding:12px 16px 2px;color:var(--muted);
              font-size:12.5px;line-height:1.5}
  .chart-note b{color:var(--ink);font-weight:650}
  /* Dividers come from borders on the cells, not the usual background-behind-
     gap trick (as .strip and .bars use elsewhere) -- with only one or two
     real B2C movers most cycles, a background-coloured grid would leave a
     large blank tinted box where unused 1fr tracks stretch to fill the row.
     Borders only paint where a cell actually exists. */
  .mm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
           border-top:1px solid var(--line)}
  .mm-cell{background:var(--surface);padding:12px 14px 14px;max-width:320px;
           display:flex;flex-direction:column;gap:6px;
           border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .mm-cell .co{font-size:13px;font-weight:600}
  .mm-cell .meta{font-size:11px;color:var(--muted);display:flex;
                 align-items:center;flex-wrap:wrap;gap:5px}
  svg.spark{background:var(--surface-2);border-radius:4px}

  button.track{font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;
        border:1px solid var(--accent);background:var(--accent-soft);
        color:var(--accent);cursor:pointer;white-space:nowrap}
  button.track:hover{background:var(--accent);color:#fff}
  button.track[disabled]{cursor:default;border-color:var(--ok);
        background:var(--ok-soft);color:var(--ok)}
  button.track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{padding:26px 16px;color:var(--muted);font-size:13.5px;text-align:center}
  .empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:3px}
  footer{color:var(--muted);font-size:12px;line-height:1.6}
  a{color:var(--accent)}
  a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  details summary{cursor:pointer;padding:10px 16px;font-size:12.5px;color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){
    .bar .fill{transition:width .5s ease}
  }
</style>

/* Two lists, both timestamped, because "what happened when I pressed add?"
   is the whole question. tracked_queue is what you asked for and Harmonic has

   add_tracked_investors.py (now targeting Final Investors). A press is never silently lost -- if the laptop is

D.tracked_queue = D.tracked_queue || [];

/* Relative for anything recent, absolute once it stops being "just now" --
   "3 days ago" is the honest reading when a sync has not run for a while, and
   is exactly what should prompt someone to chase it. */
const when = iso => {
  if (!iso) return "";
  const t = new Date(iso);
  if (isNaN(t)) return String(iso);
  const mins = Math.round((Date.now() - t.getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  if (mins < 60 * 24) return Math.round(mins / 60) + "h ago";
  const days = Math.round(mins / (60 * 24));
  return days + (days === 1 ? " day ago" : " days ago")
    + " (" + t.toISOString().slice(0, 10) + ")";
};

}

/* ---------- channel status ----------

})();

   <th class="num">Score</th><th>Status</th><th>Last Contact</th></tr></thead>`;
$("t1").innerHTML = HEAD1 + "<tbody>" +

if (retQ.length) {

} else {

}

/* ---------- panel 2: recent rounds on our radar ---------- */

   late. Owner is not ordered, so colouring it would imply a rank that does not
   exist -- those stay a single hue. */
function bars(el, obj, order) {
  const keys = order
    ? order.filter(k => obj[k]).concat(Object.keys(obj).filter(k => !order.includes(k)))
    : Object.keys(obj).sort((a, b) => obj[b] - obj[a]);
  const max = Math.max(1, ...keys.map(k => obj[k]));
  el.innerHTML = keys.length ? keys.map((k, i) =>
    `<div class="bar"><span class="lab">${esc(k)}</span>
     <span class="track"><span class="fill${order ? " s" + Math.min(6, i + 1) : ""}"
       style="width:${Math.max(2, obj[k] / max * 100).toFixed(1)}%"></span></span>
     <span class="n">${obj[k]}</span></div>`).join("")
    : `<div class="empty">Nothing active.</div>`;
}

/* ---------- panel 5: B2C momentum ----------
   Two panels, not five. The previous version had four panels describing the
   universe (reach distribution, category mix, reach-vs-traffic, coverage) and
   one trying to find targets -- and that one showed 1 brand of 1,192, because
   it depended on pairing our own snapshots. These read Harmonic's own 90- and
   180-day windows instead, which cover 938 of 1,236 brands.

   Negative growth is absent by construction, at the data layer: this section
   exists to surface brands worth looking at, and "shrank 12%" is not a lead. */
const C = D.b2c || null;

/* Axis ticks are powers of ten, so they need k/M suffixes rather than the
   comma-grouped `num()` the tables use -- "1,000,000" does not fit under a
   tick mark. (This lived in the previous five-panel block; kept because the
   log axis still needs it.) */
function compactNum(v){
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(Math.round(n));
}

function pctCell(v){
  if (v === null || v === undefined) return '<span style="color:var(--muted)">&mdash;</span>';
  const s = (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const col = v > 0 ? "var(--ok)" : (v < 0 ? "var(--crit)" : "var(--muted)");
  return '<span style="color:' + col + '">' + s + '</span>';
}

function corrDate(iso) {
  if (!iso) return "";
  const yr = iso.slice(0, 4), mo = iso.slice(5, 7), dy = iso.slice(8, 10);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m = MON[parseInt(mo, 10) - 1] || mo;
  return yr === String(new Date().getFullYear()) ? dy + " " + m : m + " '" + yr.slice(2);
}

if (!C || !C.momentum) {
  $("p5b").innerHTML = '<div class="empty"><b>No traction data</b> ' +
     'Run pull_traction_windows.py --apply, then rebuild.</div>';
  $("t5").innerHTML = "";
} else {
  const M = C.momentum || [];
  $("c5a").textContent = M.length + " growing of " + C.with_window;
  $("c5b").textContent = (C.scatter || []).length + " plotted";

  const headM = `<thead><tr><th>Brand</th><th>Sector</th><th>CRM</th><th>Lead</th>
     <th class="num">IG 90d</th><th class="num">LI 90d</th><th class="num">Web 90d</th>
     <th class="num">IG 180d</th><th>Last Contact</th></tr></thead>`;

  const rowM = m => {
    /* One axis, two poles, read off 90d against 180d:
         accelerating -- most of the half-year gain landed in the last quarter,
                         so the brand is moving NOW. This is the buy signal.
         easing       -- the run happened earlier and has since slowed.
       Neither fires on a majority (56% easing, ~20% accelerating across the
       317 on the board), so both actually discriminate. */
    /* accelerating / easing are Instagram-shape judgements (90d against 180d)
       and only 180d exists for Instagram, so they are only computed when this
       brand actually has Instagram numbers. A LinkedIn-led row simply has no
       such verdict rather than a fabricated one. */
    const hasIG  = (m.g90 !== null && m.g90 !== undefined);
    const has180 = hasIG && (m.g180 !== null && m.g180 !== undefined);
    const easing = has180 && m.g180 > m.g90 * 3;
    const accel  = has180 && m.g180 > 0 && m.g90 >= m.g180 * 0.7;
    /* Both verdicts live in the SAME cell, beside the brand. They are two
       poles of one judgement, so splitting them across columns -- accelerating
       by the name, easing over in the 180d column -- made the reader hunt in
       two places for the same fact. Flagged in an artifact comment 2026-08-25. */
    const trendTag = accel
      ? ' <span class="chip new" title="most of the half-year gain landed in the last quarter">accelerating</span>'
      : easing
      ? ' <span class="chip mute" title="the run happened earlier and has since slowed">easing</span>'
      : "";
    const href = m.domain ? (/^https?:/.test(m.domain) ? m.domain : "https://" + m.domain) : null;
    const nameCell = href
      ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(m.name)}</a>`
      : esc(m.name);
    return `<tr>
      <td class="co">${nameCell}${trendTag}</td>
      <td class="sector">${m.sector ? esc(m.sector) : "&mdash;"}</td>
      <td class="sector">${crmCell(m)}</td>
      <td class="sector"><span class="chip ${m.lead_channel === "Instagram" ? "new"
          : m.lead_channel === "LinkedIn" ? "ok" : "warn"}">${esc(m.lead_channel)}</span></td>
      <td class="num"${m.lead_channel === "Instagram" ? ' style="font-weight:600"' : ""}>${pctCell(m.g90)}</td>
      <td class="num"${m.lead_channel === "LinkedIn" ? ' style="font-weight:600"' : ""}>${pctCell(m.li90)}</td>
      <td class="num"${m.lead_channel === "Web" ? ' style="font-weight:600"' : ""}>${pctCell(m.web90)}</td>
      <td class="num">${pctCell(m.g180)}</td>
      <td class="sector">${m.last_email_date
        ? '<span class="chip" title="' + esc(m.last_email_by + " ↔ " + (m.last_email_with || "")) + '">'
          + esc(m.last_email_by) + " · " + corrDate(m.last_email_date) + "</span>"
        : ""}</td></tr>`;
  };

  const TOP = 25;
  $("t5").innerHTML = headM + "<tbody>" +
    (M.length ? M.slice(0, TOP).map(rowM).join("")
              : `<tr><td colspan="9" class="empty"><b>No brand grew this cycle</b>
                 Nothing cleared the ${num(C.floor)}-follower floor with positive
                 90-day growth.</td></tr>`) + "</tbody>";

  /* Accelerating is the rarest and most actionable state, and sorting by 90d
     buries most of them below the cut. Say how many exist and name them, so
     the signal is not lost to the sort order. */
  const accelAll = M.filter(m => m.g180 !== null && m.g180 !== undefined
                             && m.g180 > 0 && m.g90 >= m.g180 * 0.7);
  $("n5").innerHTML =
    `<b>${num(M.length)}</b> of <b>${num(C.with_window)}</b> brands with a Harmonic
     window are growing` + (M.length > TOP ? `; the top ${TOP} are shown` : "") + `.`
    + (accelAll.length
        ? ` <b>${accelAll.length}</b> are <b>accelerating</b> &mdash; most of their
            half-year gain landed in the last quarter: ${accelAll.slice(0, 6)
              .map(m => esc(m.name)).join(", ")}${accelAll.length > 6 ? " and others" : ""}.`
        : "")
    + ` A further <b>${num(C.below_floor)}</b> grew but sit under the
     ${num(C.floor)}-follower floor, where a percentage means little.
     ${num(C.total - C.with_window)} of ${num(C.total)} brands have no Instagram
     window at all. Source: ${esc(C.source)}, as of ${esc(C.as_of || "unknown")}.`;

  const S = (C.scatter || []).filter(d => d.reach > 0 && d.g90 > 0);
  if (!S.length) {
    $("p5b").innerHTML = '<div class="empty"><b>Nothing to plot</b> ' +
      'No brand has both a follower count and positive 90-day growth.</div>';
  } else {
    const W = 760, H = 380, padL = 62, padR = 96, padT = 18, padB = 46;
    const pw = W - padL - padR, ph = H - padT - padB;
    const xs = S.map(d => Math.log10(d.reach));
    /* Growth is clipped for the AXIS only, never for the value in the table --
       one brand at +900% would otherwise flatten every other point onto the
       floor and the chart would say nothing. */
    const CLIP = 100;
    const x0 = Math.floor(Math.min.apply(null, xs));
    const x1 = Math.ceil(Math.max.apply(null, xs));
    const X = v => padL + (Math.log10(v) - x0) / Math.max(0.001, x1 - x0) * pw;
    const Y = g => padT + ph - Math.min(g, CLIP) / CLIP * ph;

    let grid = "";
    for (let e = x0; e <= x1; e++) {
      const x = X(Math.pow(10, e));
      grid += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}"
                 y2="${padT + ph}" stroke="var(--line)" stroke-dasharray="2 3"/>
               <text x="${x.toFixed(1)}" y="${padT + ph + 16}" text-anchor="middle"
                 font-size="10.5" fill="var(--muted)">${compactNum(Math.pow(10, e))}</text>`;
    }
    [0, 25, 50, 75, 100].forEach(t => {
      const y = Y(t);
      grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + pw}"
                 y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 3"/>
               <text x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
                 font-size="10.5" fill="var(--muted)">${t === 100 ? "100%+" : t + "%"}</text>`;
    });

    /* The floor is drawn, not just applied. Everything left of this line is
       below the board's own 2,000-follower bar -- percentage growth there is
       noise, and a reader who cannot see the bar has no way to know which
       half of the chart to trust. */
    const fx = X(C.floor);
    const floorBand = `
      <rect x="${padL}" y="${padT}" width="${(fx - padL).toFixed(1)}" height="${ph}"
        fill="var(--surface-2)" opacity="0.75"/>
      <line x1="${fx.toFixed(1)}" y1="${padT}" x2="${fx.toFixed(1)}" y2="${padT + ph}"
        stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="${(fx - 6).toFixed(1)}" y="${(padT + 12).toFixed(1)}" text-anchor="end"
        font-size="10" fill="var(--muted)">below ${compactNum(C.floor)} followers</text>`;

    /* Two states, because only one of them is a thing to do: a solid dot is a
       brand nobody has looked at, a hollow one is already in Sevanta. Before
       this the chart drew 414 identical dots and could say nothing the table
       above it had not already said. */
    /* Each point carries an INVISIBLE r=10 hit circle behind the r=3.2 visible
       one. A 3px target is not hoverable in practice, and enlarging the dot
       itself would turn 414 points into a solid mass. */
    const scHref = d => d.domain
      ? (/^https?:/i.test(d.domain) ? d.domain : "https://" + d.domain) : null;
    const pts = S.map((d, i) => {
      const cx = X(d.reach).toFixed(1), cy = Y(d.g90).toFixed(1);
      const dim = d.reach < C.floor;
      const dot = d.in_crm
        ? `<circle cx="${cx}" cy="${cy}" r="3.2" fill="none" stroke="var(--muted)"
             stroke-width="1.1" opacity="${dim ? 0.35 : 0.75}"></circle>`
        : `<circle cx="${cx}" cy="${cy}" r="3.2" fill="var(--accent)"
             fill-opacity="${dim ? 0.22 : 0.8}"></circle>`;
      const href = scHref(d);
      const body = `${dot}<circle cx="${cx}" cy="${cy}" r="10" fill="transparent"
             style="cursor:${href ? "pointer" : "default"}"></circle>`;
      const data = `data-i="${i}" class="sc-pt"`;
      return href
        ? `<a ${data} href="${esc(href)}" target="_blank" rel="noopener">${body}</a>`
        : `<g ${data}>${body}</g>`;
    }).join("");

    /* Name only the handful worth naming: fastest growers that also clear the
       board floor, so a 12-follower rocket never earns a label. */
    /* Four, not six. The fastest growers all sit in the same corner, so every
       extra label costs more in collisions than it adds in information -- the
       board directly below names all 25 anyway. */
    /* Name the ACTIONABLE ones, not merely the fastest. The fastest are
       already the first rows of the table directly above, so labelling them
       again told the reader nothing new. Priority: clears the floor AND is not
       yet in Sevanta -- that is the only combination on this chart that
       implies a next step. */
    const actionable = S.filter(d => d.reach >= C.floor && !d.in_crm)
                        .sort((a, b) => b.g90 - a.g90);
    const named = (actionable.length ? actionable
                                     : S.filter(d => d.reach >= C.floor)
                                        .sort((a, b) => b.g90 - a.g90)).slice(0, 5);
    /* The fastest growers cluster at the top of the plot, so their labels
       collide. Nudge each one below the previous when they are within a line
       height -- the dot stays on the true point, only the text moves, and a
       leader line keeps the pairing unambiguous. */
    /* Baseline separation must exceed the glyph box, not equal it: at
       font-size 10.5 the bbox is ~12.2px tall, so 12 still overlaps by a
       hair. 16 leaves visible air between stacked labels. */
    const LINE = 16;
    const placed = named
      .map(d => ({ d, x: X(d.reach), y: Y(d.g90) }))
      .sort((a, b) => a.y - b.y);
    for (let i = 1; i < placed.length; i++) {
      if (placed[i].y - placed[i - 1].y < LINE) placed[i].y = placed[i - 1].y + LINE;
    }
    const labels = placed.map(p => {
      const trueY = Y(p.d.g90);
      const flip = p.x > padL + pw * 0.62;
      const tx = flip ? p.x - 8 : p.x + 8;
      const nm = p.d.name.length > 20 ? p.d.name.slice(0, 19) + "\u2026" : p.d.name;
      const leader = Math.abs(p.y - trueY) > 1.5
        ? `<line x1="${p.x.toFixed(1)}" y1="${trueY.toFixed(1)}" x2="${tx.toFixed(1)}"
             y2="${(p.y - 3).toFixed(1)}" stroke="var(--muted)" stroke-width="0.7"
             stroke-opacity="0.55"/>` : "";
      return `${leader}<circle cx="${p.x.toFixed(1)}" cy="${trueY.toFixed(1)}" r="4.2"
                fill="var(--accent)"></circle>
              <text x="${tx.toFixed(1)}" y="${p.y.toFixed(1)}"
                text-anchor="${flip ? "end" : "start"}" font-size="10.5"
                fill="var(--ink-2)">${esc(nm)}</text>`;
    }).join("");

    $("p5b").innerHTML = `<div class="chart-wrap" style="position:relative">
      <div id="sc-tip" role="status" style="position:absolute;display:none;
        pointer-events:none;z-index:5;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--radius);
        padding:7px 9px;font-size:12px;line-height:1.45;max-width:230px;
        box-shadow:0 2px 10px rgba(0,0,0,.14)"></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="Instagram followers against 90-day growth for ${S.length} growing B2C brands.">
        <text x="${padL}" y="${padT - 4}" font-size="10.5"
          fill="var(--muted)">90-day growth &#8593;</text>
        ${floorBand}${grid}${pts}${labels}
        <text x="${padL + pw}" y="${H - 10}" text-anchor="end" font-size="10.5"
          fill="var(--muted)">Instagram followers (log) &#8594;</text>
        <g transform="translate(${padL + pw + 12}, ${padT + 6})" font-size="10.5">
          <circle cx="5" cy="0" r="3.2" fill="var(--accent)" fill-opacity="0.8"/>
          <text x="14" y="3.5" fill="var(--ink-2)">not in CRM</text>
          <circle cx="5" cy="18" r="3.2" fill="none" stroke="var(--muted)" stroke-width="1.1"/>
          <text x="14" y="21.5" fill="var(--ink-2)">in Sevanta</text>
        </g>
      </svg>
      <p class="chart-note" style="padding-left:0;padding-right:0">
        <b>${num(actionable.length)}</b> brands clear the
        ${compactNum(C.floor)}-follower bar and are <b>not yet in Sevanta</b> &mdash;
        the solid dots right of the dashed line. Those are the ones with a next
        step; the named five are the fastest of them. Hollow dots are already
        yours, and everything in the shaded band is below the bar where a
        percentage means little.</p>
      </div>`;

    /* Hover to identify, click to open the site. The dots were anonymous --
       you could see that something small was growing fast but not what, which
       is most of why the chart felt inert. */
    (function(){
      const wrap = $("p5b").querySelector(".chart-wrap");
      const tip  = $("sc-tip");
      const show = (el, ev) => {
        const d = S[Number(el.getAttribute("data-i"))];
        if (!d) return;
        const href = scHref(d);
        tip.innerHTML =
          `<div style="font-weight:600">${esc(d.name)}</div>`
          + `<div style="color:var(--muted)">${d.sector ? esc(d.sector) + " · " : ""}`
          + `${num(d.reach)} followers</div>`
          + `<div><b>${d.g90 > 0 ? "+" : ""}${d.g90}%</b> over 90 days</div>`
          + `<div style="color:var(--muted)">${d.in_crm
               ? "in Sevanta" + (d.crm_status ? " · " + esc(d.crm_status) : "")
               : "not in CRM"}</div>`
          + (href ? `<div style="color:var(--accent)">click to open site</div>` : "");
        const r = wrap.getBoundingClientRect();
        let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
        tip.style.display = "block";
        /* Flip before the tooltip leaves the panel, otherwise points on the
           right edge push it off and it is unreadable exactly where the
           largest brands sit. */
        if (x + tip.offsetWidth > r.width) x = ev.clientX - r.left - tip.offsetWidth - 14;
        if (y + tip.offsetHeight > r.height) y = ev.clientY - r.top - tip.offsetHeight - 14;
        tip.style.left = Math.max(0, x) + "px";
        tip.style.top  = Math.max(0, y) + "px";
      };
      wrap.addEventListener("mousemove", ev => {
        const el = ev.target.closest(".sc-pt");
        if (el) show(el, ev); else tip.style.display = "none";
      });
      wrap.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    })();
  }
}

/* ---------- panel 5c: B2C brand directory ----------
   Migrated from b2c_dashboard.html (P1-1, 2026-08-25). The momentum board
   above answers "who is moving"; this answers "who is in the universe and
   where do I reach them" -- handles, HQ and a one-line description, none of
   which the momentum rows carry.

   Rows are filtered, never paginated: 823 brands is too many to scroll but the
   useful access pattern is "find this one brand", not "read all of them". */
(function () {
  const R = (D.b2c && D.b2c.directory) || [];
  const B = D.b2c || {};
  if (!R.length) {
    $("tdir").innerHTML = "";
    $("ndir").innerHTML = '<span class="empty"><b>No directory data</b> '
      + 'Rebuild with build_dashboard.py.</span>';
    return;
  }

  /* A YouTube handle is either a channel ID (UC + 22 chars, what the API
     returns) or a vanity name -- they take different URL shapes and guessing
     wrong gives a 404 on a partner-facing page. */
  const ytHref = h => /^UC[\w-]{22}$/.test(h)
    ? "https://youtube.com/channel/" + h
    : "https://youtube.com/@" + h.replace(/^@/, "");

  const LINKS = [
    ["ig_handle", "IG", h => "https://instagram.com/" + h.replace(/^@/, "")],
    ["tt_handle", "TikTok", h => "https://tiktok.com/@" + h.replace(/^@/, "")],
    ["li_handle", "LinkedIn", h => "https://linkedin.com/company/" + h],
    ["yt_handle", "YouTube", ytHref],
    ["x_handle", "X", h => "https://x.com/" + h.replace(/^@/, "")],
  ];

  const linkCell = d => {
    const out = LINKS.filter(([k]) => d[k]).map(([k, label, href]) =>
      `<a href="${esc(href(d[k]))}" target="_blank" rel="noopener"
          title="${esc(d[k])}">${label}</a>`);
    return out.length ? `<span class="hdl">${out.join("")}</span>`
                      : '<span style="color:var(--muted)">&mdash;</span>';
  };

  const n = v => v ? compactNum(v)
                   : '<span style="color:var(--muted)">&mdash;</span>';

  const row = d => {
    const href = d.domain
      ? (/^https?:/i.test(d.domain) ? d.domain : "https://" + d.domain) : null;
    const nameCell = href
      ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(d.name)}</a>`
      : esc(d.name);
    const crm = d.in_crm
      ? ` <span class="chip mute" title="already in Sevanta">${esc(d.crm_status || "in CRM")}</span>`
      : "";
    return `<tr>
      <td class="co">${nameCell}${crm}
        ${d.blurb ? `<span class="blurb">${esc(d.blurb)}</span>` : ""}</td>
      <td class="sector">${d.sector ? esc(d.sector) : "&mdash;"}</td>
      <td class="sector">${d.hq ? esc(d.hq) : "&mdash;"}</td>
      <td class="num">${n(d.ig)}</td>
      <td class="num">${n(d.tt)}</td>
      <td class="num">${n(d.li)}</td>
      <td class="num">${n(d.yt)}</td>
      <td>${linkCell(d)}</td>
      <td class="sector">${d.last_email_date
        ? '<span class="chip" title="' + esc(d.last_email_by + " ↔ " + (d.last_email_with || "")) + '">'
          + esc(d.last_email_by) + " · " + corrDate(d.last_email_date) + "</span>"
        : ""}</td></tr>`;
  };

  const HEAD = `<thead><tr><th>Brand</th><th>Sector</th><th>HQ</th>
    <th class="num">Instagram</th><th class="num">TikTok</th>
    <th class="num">LinkedIn</th><th class="num">YouTube</th>
    <th>Profiles</th><th>Last Contact</th></tr></thead>`;

  /* 15, not 50. At 1,282 brands this table is a lookup tool, not a leaderboard
     -- the useful action is "find this one brand", which the filter does. A
     long default just pushed everything below it off the page. */
  const LIM = 15;
  /* One lowercased haystack per row, built once. Rebuilding it per keystroke
     over 823 rows x 8 fields is the difference between instant and laggy. */
  R.forEach(d => {
    d._q = [d.name, d.sector, d.hq, d.blurb, d.ig_handle, d.tt_handle,
            d.li_handle, d.yt_handle, d.x_handle]
      .filter(Boolean).join(" ").toLowerCase();
  });

  function draw(q) {
    const hits = q ? R.filter(d => d._q.includes(q)) : R;
    $("tdir").innerHTML = HEAD + "<tbody>" +
      (hits.length
        ? hits.slice(0, LIM).map(row).join("")
        : `<tr><td colspan="9" class="empty"><b>No brand matches
           &ldquo;${esc(q)}&rdquo;</b> Try a sector, a country or part of a
           handle.</td></tr>`) + "</tbody>";
    $("cdir").textContent = q
      ? hits.length + " of " + R.length + " match"
      : R.length + " brands";
    $("ndir").innerHTML =
      (hits.length > LIM
        ? `Showing the top <b>${LIM}</b> of <b>${num(hits.length)}</b> by tracked
           reach &mdash; filter to narrow it. `
        : "")
      + `Every company carrying the <code>is_b2c_brand</code> flag, minus Agtech
         and out-of-scope. 234 business-to-business companies had that flag
         cleared on 2026-08-25 &mdash; ingredient houses, food-safety software
         and cultivated-meat producers that were never consumer brands.`
      + (B.directory_handles_suppressed
          ? ` <b>${B.directory_handles_suppressed}</b> handle(s) resolved to an
             unrelated marketplace or platform account and were suppressed along
             with their follower counts.`
          : "")
      + ` A blank cell means the channel was never collected, not zero.`;
  }

  draw("");
  let t = null;
  $("dirq").addEventListener("input", ev => {
    clearTimeout(t);
    const q = ev.target.value.trim().toLowerCase();
    t = setTimeout(() => draw(q), 120);
  });
})();

/* ---------- track queue: self-publish ----------
   Rebuilds the WHOLE document from the three pristine tags and publishes it.
   Nothing is written on load -- only after a real press -- and a `conflict`
   means another view published first, in which case every view reloads to the
   winner and there is nothing to retry. */
(function () {
  let ns = null, busy = false;
  const close = "<" + "/script>";
  function buildDoc() {
    return '<!doctype html><html><head>' + document.head.innerHTML + '</head><body>'
      + '<div id="root"></div>'
      + '<script id="shell" type="text/plain">'
        + document.getElementById("shell").textContent + close
      + '<script id="data" type="application/json">'
        + JSON.stringify(D).replace(/<\//g, "<\\/") + close
      + '<script id="app">' + document.getElementById("app").textContent + close
      + '</body></html>';
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest && ev.target.closest("button.track");
    if (!b || b.disabled || busy) return;
    const name = b.getAttribute("data-n");
    if (!name || D.tracked_queue.some(x => x.name === name)) return;
    if (!ns) { b.textContent = "cannot save"; return; }
    busy = true;
    b.textContent = "saving\u2026";
    D.tracked_queue.push({ name: name, at: new Date().toISOString() });
    ns.publish(buildDoc()).catch(e => {
      busy = false;
      if (!e || e.code !== "conflict") {
        D.tracked_queue = D.tracked_queue.filter(x => x.name !== name);
        renderNI();
      }
    });
  });
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(n => { ns = n; renderNI(); });
  }
})();

/* ---------- per-panel staleness ---------- */
(function(){
  const PS = D.panel_sources || {};
  document.querySelectorAll("[data-src]").forEach(sec => {
    const key = sec.getAttribute("data-src");
    const src = PS[key];
    if (!src || !src.as_of) return;
    const phead = sec.querySelector(".phead");
    const count = phead && phead.querySelector(".count");
    if (!phead) return;
    const age = (Date.now() - new Date(src.as_of).getTime()) / 86400000;
    const c = src.cadence_days || 7;
    const cls = age <= c * 1.25 ? "ok" : age <= c * 2 ? "warn" : "crit";
    const span = document.createElement("span");
    span.className = "asof";
    span.innerHTML = '<span class="dot" style="background:var(--' + cls + ')"></span>'
      + esc(when(src.as_of));
    if (count) phead.insertBefore(span, count);
    else phead.appendChild(span);
  });
})();
